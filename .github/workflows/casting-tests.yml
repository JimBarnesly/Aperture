name: Experimental casting tests
on:
  push:
    paths:
      - 'casting/**'
      - '.github/workflows/casting-tests.yml'
  pull_request:
    paths:
      - 'casting/**'
      - '.github/workflows/casting-tests.yml'
permissions:
  contents: read
jobs:
  wrapper-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned experimental dependencies
        working-directory: casting
        run: npm ci --no-audit --no-fund
      - name: Apply checked compatibility patches and test
        working-directory: casting
        run: |
          node patch-support.mjs
          npm test
          npm audit --omit=dev
          sh -n setup.sh
