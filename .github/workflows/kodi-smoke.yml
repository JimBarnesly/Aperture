name: Kodi 21.3 startup and navigation
on:
  push:
    branches: [fix/kodi21-startup, feat/native-format-turntable]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kodi-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: debian:forky-slim
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install official Debian Kodi 21.3 runtime
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git python3 python3-pil kodi kodi-bin kodi-data xvfb xauth xdotool x11-utils x11-apps mesa-utils libgl1-mesa-dri imagemagick fonts-noto-core fonts-noto-mono fonts-roboto-unhinted pulseaudio pulseaudio-utils
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate and assemble exact source
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/build_skin.py
      - name: Exercise real Kodi in an isolated profile
        run: bash tools/ci_kodi_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aperture-kodi21-${{ github.sha }}
          path: |
            build/kodi-smoke/
            dist/
          if-no-files-found: warn
          retention-days: 14
