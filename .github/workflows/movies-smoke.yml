name: Kodi 21.3 cinematic movies acceptance
on:
  workflow_dispatch:
  push: {}

permissions:
  contents: read
jobs:
  movies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sources: [single, default, multiple, empty, online]
    container:
      image: debian:forky-slim
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      APERTURE_MOVIES_SCENARIO: ${{ matrix.sources }}
      # Diagnostic-only until the native SIGSEGV has a faulting stack.
      APERTURE_MOVIES_NATIVE_DEBUG: ${{ matrix.sources == 'online' && '1' || '0' }}
    steps:
      - name: Install signed distribution Kodi and synthetic fixture tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git python3 python3-pil ffmpeg kodi kodi-bin kodi-data xvfb xauth x11-utils libgl1-mesa-dri fonts-noto-core fonts-noto-mono fonts-roboto-unhinted pulseaudio pulseaudio-utils
      - name: Install native capture tools for isolated online case
        if: matrix.sources == 'online'
        run: apt-get install --yes --no-install-recommends gdb binutils
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise disposable Kodi profile as unprivileged user
        run: |
          python3 -m unittest discover -s tests -v
          useradd --create-home --shell /bin/bash moviesqa
          chown -R moviesqa:moviesqa "$GITHUB_WORKSPACE"
          runuser -u moviesqa -- bash tools/movies_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aperture-movies-${{ matrix.sources }}-${{ github.sha }}
          path: build/movies-smoke/
          if-no-files-found: warn
          retention-days: 14

